name: Build Gigs Website

on:
  push:
    paths:
      - 'gigs.json'
      - 'build.py'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run build script
        run: python build.py

      - name: Commit updated HTML files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-build HTML files from gigs.json"
          file_pattern: index.html gigs.html
