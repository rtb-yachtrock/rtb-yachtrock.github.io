<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - RTB Yacht Rock</title>
    <!-- Font Awesome CDN for professional social icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Responsive Logo Style -->
    <style>
        .nav-logo {
            width: 75px;
            border-radius: 6px;
            vertical-align: middle;
        }
        @media (max-width: 600px) {
            .nav-logo {
                width: 75px;
            }
        }
    </style>
</head>
<body style="background-color: #0284c7; color: #ffffff; font-family: sans-serif; text-align: center; margin: 0; padding: 0;">

    <!-- Top Navigation Bar -->
    <div style="background-color: #0369a1; padding: 15px 15px; display: flex; justify-content: space-between; align-items: center;">
        
        <!-- Logo acting as permanent Home Link -->
        <a href="index.html">
            <img src="images/rtb_logo_2.jpg" alt="RTB Logo" class="nav-logo">
        </a>

        <!-- Navigation Links with compact mobile spacing to fit all 5 items -->
        <div style="font-size: 14px;">
            <a href="index.html" style="color: #ffffff; text-decoration: none; margin: 0 5px;">Home</a>
            <a href="gigs.html" style="color: #ffffff; text-decoration: none; margin: 0 5px;">Gigs</a>
            <a href="bio.html" style="color: #ffffff; text-decoration: none; margin: 0 5px;">Bio</a>
            <a href="media.html" style="color: #ffffff; text-decoration: none; margin: 0 5px;">Media</a>
            <a href="contact.html" style="color: #ffffff; text-decoration: none; margin: 0 5px; font-weight: bold;">Contact</a>
        </div>
    </div>

    <!-- Contact Content Area -->
    <div style="padding: 40px 20px; max-width: 600px; margin: 0 auto; text-align: left;">
        <h2 style="margin-bottom: 20px; color: #fef08a; font-weight: bold;">Get In Touch</h2>
        
        <p style="font-size: 16px; line-height: 1.6; color: rgba(255, 255, 255, 0.9); margin-bottom: 30px;">
            Interested in booking the band, private parties, corporate events, or general inquiries? Drop us a line anytime and we’ll get back to you soon.
        </p>

        <!-- Direct Email Card / Button -->
        <div style="background-color: rgba(255, 255, 255, 0.1); padding: 30px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.3); margin-bottom: 30px;">
            <div style="font-size: 14px; text-transform: uppercase; color: #fef08a; font-weight: bold; margin-bottom: 12px;">Booking & Inquiries</div>
            
            <a href="mailto:rtb-yachtrock@gmail.com" style="background-color: #ffffff; color: #0284c7; padding: 12px 24px; text-decoration: none; font-size: 16px; font-weight: bold; border-radius: 25px; display: inline-block; box-shadow: 0 2px 5px rgba(0,0,0,0.2);">
                ✉️ rtb-yachtrock@gmail.com
            </a>
        </div>

        <p style="font-size: 14px; color: rgba(255, 255, 255, 0.7); font-style: italic;">
            Based in the Chicago area.
        </p>
    </div>

</body>
</html>
