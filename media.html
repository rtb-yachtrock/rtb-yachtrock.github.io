<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTB Yacht Rock - Media</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        /* Header / Navigation Bar */
        header {
            background-color: #1a1a2e;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: nowrap;
        }
        .logo-area {
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            white-space: nowrap;
        }
        nav {
            white-space: nowrap;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin-left: 15px;
            font-size: 14px;
        }
        nav a:hover {
            text-decoration: underline;
        }
        /* Main Content */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }
        h1 {
            margin-top: 20px;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .section-title {
            margin-top: 40px;
            margin-bottom: 20px;
            font-size: 24px;
            border-bottom: 2px solid #ddd;
            display: inline-block;
            padding-bottom: 5px;
        }
        /* Photo Gallery Grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .gallery-item {
            background: #fff;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: left;
        }
        .gallery-item img {
            width: 100%;
            height: auto;
            border-radius: 4px;
            display: block;
        }
        .caption {
            font-size: 14px;
            color: #555;
            margin-top: 8px;
            text-align: center;
        }
        /* Video Section */
        .video-container {
            max-width: 800px;
            margin: 0 auto 40px auto;
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            background: #000;
            margin-bottom: 15px;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <!-- Site Header / Navigation -->
    <header>
        <div class="logo-area">
            RTB
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="gigs.html">Gigs</a>
            <a href="bio.html">Bio</a>
            <a href="media.html">Media</a>
        </nav>
    </header>

    <div class="container">
        <h1>Media</h1>
        <div class="subtitle">Photos and clips from the road</div>

        <!-- PHOTO GALLERY -->
        <div class="section-title">Photo Gallery</div>
        <div class="gallery-grid">
            
            <div class="gallery-item">
                <img src="images/friendly_01.png" alt="Band live performance">
                <div class="caption">Getting into the groove</div>
            </div>

            <div class="gallery-item">
                <img src="images/friendly_02.png" alt="Live performance shot">
            </div>

            <div class="gallery-item">
                <img src="images/group_pic_friendly.png" alt="Band group photo">
                <div class="caption">The crew</div>
            </div>

            <div class="gallery-item">
                <img src="images/ken_01.jpg" alt="Ken playing live">
            </div>

        </div>

        <!-- VIDEO SECTION -->
        <div class="section-title">Videos</div>
        <div class="video-container">
            <div class="video-wrapper">
                <!-- PJ's brother's video as a placeholder... unless we don't like it -->
                <iframe src="https://www.youtube.com/embed/IX7Uhui463E" allowfullscreen></iframe>
            </div>
            <div class="caption">Live bootleg footage (9/6 Gig)</div>
        </div>
    </div>

</body>
</html>
