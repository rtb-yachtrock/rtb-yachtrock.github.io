<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media - RTB Yacht Rock</title>
    <!-- Font Awesome CDN for professional social icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Responsive Logo Style -->
    <style>
        .nav-logo {
            width: 75px;
            border-radius: 6px;
            vertical-align: middle;
        }
        @media (max-width: 600px) {
            .nav-logo {
                width: 75px;
            }
        }
        /* Gallery Grid Styles */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .gallery-item {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-align: left;
        }
        .gallery-item img {
            width: 100%;
            height: auto;
            border-radius: 6px;
            display: block;
        }
        .caption {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
            margin-top: 10px;
            text-align: center;
        }
        /* Video Container Styles */
        .video-container {
            max-width: 700px;
            margin: 0 auto 40px auto;
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: #000;
            margin-bottom: 15px;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body style="background-color: #0284c7; color: #ffffff; font-family: sans-serif; text-align: center; margin: 0; padding: 0;">

    <!-- Top Navigation Bar -->
    <div style="background-color: #0369a1; padding: 15px 15px; display: flex; justify-content: space-between; align-items: center;">
        
        <!-- Logo acting as permanent Home Link -->
        <a href="index.html">
            <img src="images/rtb_logo_2.jpg" alt="RTB Logo" class="nav-logo">
        </a>

        <!-- Navigation Links with compact mobile spacing to fit all 5 items -->
        <div style="font-size: 14px;">
            <a href="index.html" style="color: #ffffff; text-decoration: none; margin: 0 5px;">Home</a>
            <a href="gigs.html" style="color: #ffffff; text-decoration: none; margin: 0 5px;">Gigs</a>
            <a href="bio.html" style="color: #ffffff; text-decoration: none; margin: 0 5px;">Bio</a>
            <a href="media.html" style="color: #ffffff; text-decoration: none; margin: 0 5px; font-weight: bold;">Media</a>
            <a href="contact.html" style="color: #ffffff; text-decoration: none; margin: 0 5px;">Contact</a>
        </div>
    </div>

    <!-- Media Content Area -->
    <div style="padding: 40px 20px; max-width: 800px; margin: 0 auto; text-align: left;">
        <h2 style="text-align: center; margin-bottom: 10px; color: #fef08a; font-weight: bold;">Media</h2>
        <p style="text-align: center; color: rgba(255, 255, 255, 0.9); margin-bottom: 40px;">Photos and clips from the road</p>

        <!-- PHOTO GALLERY -->
        <h3 style="text-align: center; margin-bottom: 20px; font-size: 20px; color: #fef08a;">Photo Gallery</h3>
        <div class="gallery-grid">
            
            <div class="gallery-item">
                <img src="images/friendly_01.png" alt="Band live performance">
                <div class="caption">Getting into the groove</div>
            </div>

            <div class="gallery-item">
                <img src="images/friendly_02.png" alt="Live performance shot">
            </div>

            <div class="gallery-item">
                <img src="images/group_pic_friendly.jpeg" alt="Band group photo">
                <div class="caption">The crew</div>
            </div>

            <div class="gallery-item">
                <img src="images/ken_01.jpg" alt="Ken playing live">
            </div>

        </div>

        <!-- VIDEO SECTION -->
        <h3 style="text-align: center; margin-top: 50px; margin-bottom: 20px; font-size: 20px; color: #fef08a;">Videos</h3>
        <div class="video-container">
            <div class="video-wrapper">
                <!-- PJ's brother's YT channel -->
                <iframe src="https://www.youtube.com/embed/IX7Uhui463E" allowfullscreen></iframe>
            </div>
            <div class="caption" style="text-align: center;">Live bootleg footage (9/6 Gig)</div>
        </div>
    </div>

</body>
</html>
